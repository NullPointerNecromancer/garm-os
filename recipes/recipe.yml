---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

# Garm – familjens egen distro
name: garm
description: Garm – familjens egen Linux. Bazzite KDE med Nvidia, robust och utan krusiduller.

# Bas: Bazzite KDE för moderna Nvidia-kort (GTX 16 / RTX och nyare)
base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable

modules:
  # Egna filer: allt under files/system/ i repot kopieras till samma sökväg i systemet
  # (fastfetch-logga och inställningar)
  - type: files
    files:
      - source: system
        destination: /

  # Program som bakas in i själva systemet (RPM). Lägg till en rad per program.
  - type: dnf
    install:
      packages:
        - htop

  # Appar som installeras automatiskt på alla datorer, för alla användare
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        install:
          - com.nextcloud.desktopclient.nextcloud

  # Systemets namn – visas i fastfetch och systeminställningar.
  # ID lämnas orört med flit, så att Bazzites egna verktyg fortsätter fungera.
  - type: os-release
    properties:
      NAME: Garm
      PRETTY_NAME: Garm (Bazzite KDE)

  # Signering av imagen – krävs, rör ej
  - type: signing
